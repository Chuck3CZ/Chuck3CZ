<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gangster Revival</title>
<style>
  :root { --bg: #111; --fg: #ddd; --muted: #888; --accent: #c9a14a; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; }
  header { width: 100%; max-width: 1000px; display: flex; justify-content: space-between; align-items: baseline; padding: 8px 16px; box-sizing: border-box; }
  header h1 { margin: 0; font-size: 18px; color: var(--accent); letter-spacing: .5px; }
  header span { color: var(--muted); font-size: 12px; }
  #game { width: min(1000px, 100vw); aspect-ratio: 4 / 3; max-height: calc(100vh - 80px); }
  #game ruffle-player, #game ruffle-object, #game > * { width: 100%; height: 100%; }
  footer { color: var(--muted); font-size: 12px; padding: 6px 16px; text-align: center; }
  select { background: #222; color: var(--fg); border: 1px solid #444; border-radius: 4px; padding: 2px 4px; }
</style>
</head>
<body>
<header>
  <h1 id="title">Gangster Revival</h1>
  <span>language
    <select id="lang">
      <option value="CZ">Čeština</option><option value="GB">English</option><option value="DE">Deutsch</option>
      <option value="PL">Polski</option><option value="FR">Français</option><option value="IT">Italiano</option>
      <option value="ES">Español</option><option value="PT">Português</option><option value="NL">Nederlands</option>
      <option value="RU">Русский</option><option value="TR">Türkçe</option><option value="GR">Ελληνικά</option>
      <option value="HU">Magyar</option><option value="FI">Suomi</option><option value="SE">Svenska</option>
      <option value="NO">Norsk</option><option value="DK">Dansk</option><option value="JP">日本語</option>
      <option value="KR">한국어</option>
    </select>
  </span>
</header>
<div id="game"></div>
<footer>Fan-made private server for Goodgame Gangster. Not affiliated with Goodgame Studios. Runs on <a href="https://ruffle.rs" style="color:inherit">Ruffle</a>.</footer>
<script>/*SERVER_CONFIG*/</script>
<script src="/ruffle/ruffle.js"></script>
<script>
  const cfg = window.GANGSTER;
  document.getElementById('title').textContent = cfg.serverName;

  const langSel = document.getElementById('lang');
  // ?country=CZ, then the last choice, then the browser language
  const BY_LANG = { cs: 'CZ', sk: 'CZ', de: 'DE', pl: 'PL', fr: 'FR', it: 'IT', es: 'ES', pt: 'PT', nl: 'NL', ru: 'RU',
    tr: 'TR', el: 'GR', hu: 'HU', fi: 'FI', sv: 'SE', no: 'NO', nb: 'NO', da: 'DK', ja: 'JP', ko: 'KR' };
  let country = BY_LANG[(navigator.language || 'en').slice(0, 2).toLowerCase()] || 'GB';
  try { country = localStorage.getItem('gangster.country') || country; } catch {}
  country = (new URLSearchParams(location.search).get('country') || country).toUpperCase();
  langSel.value = country;
  if (!langSel.value) langSel.value = 'GB';
  langSel.onchange = () => {
    try { localStorage.setItem('gangster.country', langSel.value); } catch {}
    location.reload();
  };

  window.RufflePlayer = window.RufflePlayer || {};
  window.RufflePlayer.config = {
    publicPath: '/ruffle/',
    autoplay: 'on',
    unmuteOverlay: 'hidden',
    splashScreen: false,
    letterbox: 'on',
    logLevel: new URLSearchParams(location.search).has('debug') ? 'info' : 'warn',
    // The client talks to Goodgame's CDN hosts; send those requests to this server instead.
    urlRewriteRules: [
      [/^https?:\/\/[a-z0-9.-]*goodgamestudios\.com\/(.*)$/i, `${cfg.origin}/cdn/$1`],
      [/^https?:\/\/[a-z0-9.-]*ggs-hh\.net\/(.*)$/i, `${cfg.origin}/cdn/$1`],
    ],
    // SmartFox TCP socket -> WebSocket bridge on this server
    socketProxy: [cfg.socket],
    upgradeToHttps: location.protocol === 'https:',
    maxExecutionDuration: 30,
  };

  window.addEventListener('load', () => {
    const ruffle = window.RufflePlayer.newest();
    const player = ruffle.createPlayer();
    document.getElementById('game').appendChild(player);
    player.ruffle().load({
      url: '/game/GoodgameGangster.swf',
      parameters: { network: '1', selectedCountry: langSel.value },
      allowScriptAccess: false,
    });
    window.player = player;
  });
</script>
</body>
</html>
